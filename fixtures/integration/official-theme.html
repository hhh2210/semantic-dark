<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Official theme integration fixture</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/official-theme.css">
    <script>
      globalThis.officialInitialState = {
        semanticDarkActive: document.documentElement.hasAttribute('data-semantic-dark-active'),
        theme: document.documentElement.getAttribute('data-theme'),
      };
    </script>
  </head>
  <body>
    <main id="official-theme-canvas">
      <article id="official-theme-card">
        <p>Official site theme</p>
        <h1>This page provides its own dark appearance</h1>
        <p>Semantic Dark should flip data-theme and then leave the authored colors untouched.</p>
      </article>
    </main>
  </body>
</html>
